<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>
	<title>Bookstore</title>
</head>

<style>
	iframe {
		width: 100%;
		height: 100%;
		border-style: dashed;
		border-radius: 20px;
		border-color: black;
	}

	.navbar {
		width: 25%;
		height: 100%;
		display: flex;
		border-style: solid;
		/* border-radius: 10px; */
		border-color: black;
		border-top-width: 0px;
		border-left-width: 0px;
		flex-direction: column;
		border-bottom-width: 0px;
	}

	.page-container {
		flex-direction: row;
		display: flex;
		height: 100%;
		width: 100%;
		padding: 0;
		margin: 0;
	}

	body {
		height: 100%;
		width: 100%;
		padding: 0;
		margin: 0;
	}
</style>

<body>
	<div class="page-container">
		<div class="navbar">
			<ul>
				<li><a
						href="/"
						data-book="1"
					>Book 1</a></li>
				<li><a
						href="/"
						data-book="1"
					>Book 2</a></li>
				<li><a
						href="/"
						data-book="1"
					>Book 3</a></li>
			</ul>
		</div>
		<iframe
			width="33%"
			height="33%"
			class="book"
			title="Right"
			src="await-select.html"
			referrerpolicy="origin"
		>
		</iframe>
	</div>
</body>

<script>
	/** @type { HTMLIFrameElement } */
	const g_iframeBook = document.querySelector("iframe.book");
	g_iframeBook.src = `${g_iframeBook.dataset.book}`;
</script>

</html>
